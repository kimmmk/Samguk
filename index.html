<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삼국전기 RPG 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#0d1122;--panel:rgba(14,18,36,.72);--panel2:rgba(22,27,52,.88);--line:rgba(236,208,140,.42);--gold:#ecd08c;--gold-hi:#fff3cf;--cream:#ece5d8;--cream-ink:#3b4255;--text:#f4efe4;--muted:#b9bfd4;--hp:#8fd46a;--mp:#6ab0ff;--ki:#f2c65a;--bad:#ff6a5a;
  --serif:'Noto Serif KR','Batang','AppleMyungjo',serif;--sans:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;touch-action:none;background:var(--ink)}
#gl,#gl canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.dim{color:var(--muted)}
/* 떠오르는 글자 */
.dn{position:absolute;left:0;top:0;font:900 21px/1 var(--serif);color:#fff;white-space:nowrap;will-change:transform,opacity;text-shadow:0 0 2px #10131f,0 2px 0 rgba(0,0,0,.6)}
.dn.crit{color:#ffd35c;font-size:30px}.dn.hurt{color:#ff7263}.dn.heal{color:#a4f28a;font-size:17px}.dn.gold{color:#ffd35c;font-size:16px}.dn.block{color:#cfd6e6;font-size:15px}.dn.burn{color:#ff9a5a;font-size:14px}
.dn.el-fire{color:#ffae70}.dn.el-ice{color:#bff0ff}.dn.el-bolt{color:#dcc8ff}.dn.react{color:#fff;font-size:22px;letter-spacing:.1em;text-shadow:0 0 12px #ff9ad0,0 2px 0 #3a1030}
.dn.skill{font-size:22px;color:var(--gold-hi);letter-spacing:.12em;text-shadow:0 0 12px rgba(255,208,120,.9),0 2px 0 #3a2a10}
.ebar{position:absolute;left:0;top:0;width:60px;pointer-events:none}
.ebar span{display:block;font:700 11px/1.3 var(--sans);text-align:center;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.ebar.elite span{color:#ffd35c}.ebar.ally span{color:#a8ffb0}
.ebar i{display:block;height:5px;width:100%;background:linear-gradient(90deg,#ff5a45,#ffab82);border:1px solid rgba(0,0,0,.6);border-radius:3px}
.ebar.ally i{background:linear-gradient(90deg,#5ad86a,#a8ffb0)}
.lootl{position:absolute;left:0;top:0;font:700 12px/1 var(--sans);white-space:nowrap;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);padding:2px 6px;background:rgba(0,0,0,.35);border-radius:4px}
.lootl.bad{outline:1px solid #ff5a4a}
.bubble{position:absolute;left:0;top:0;max-width:300px;padding:10px 14px;background:rgba(255,248,230,.95);color:#2a1a0a;border:2px solid #8a5a20;border-radius:10px;font:14px/1.5 var(--sans)}
.bubble small{display:block;color:#8a3a10;font-weight:700;font-size:12px}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.hp-panel{display:flex;gap:12px;align-items:flex-start;max-width:min(440px,72vw)}
.portrait{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:900 28px/1 var(--serif);color:var(--gold-hi);background:radial-gradient(circle at 35% 30%,var(--pc,#3a8a60),#101428 78%);border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 18px rgba(236,208,140,.35)}
.bars{flex:1;min-width:0;display:grid;gap:4px}
.nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 16px/1.1 var(--serif);text-shadow:0 1px 3px #000}
.nm small{font:500 12px var(--sans);color:var(--gold)}.nm em{font-style:normal;font:500 12px var(--sans);color:#ff9a8a;letter-spacing:.1em}
.bar{position:relative;height:10px;border-radius:6px;background:rgba(6,8,18,.72);border:1px solid rgba(255,255,255,.26);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px}
#hpbar i{background:linear-gradient(180deg,#b6f08e,var(--hp) 60%,#5fa844)}#hpbar.low i{background:linear-gradient(180deg,#ffa090,var(--bad) 60%,#c43a30)}
#hpbar em,#kibar em{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:700 9px/1 var(--sans);font-style:normal;color:#10131f;opacity:.8}
#mpbar{height:6px}#mpbar i{background:linear-gradient(90deg,#3a78e0,var(--mp),#bfe2ff)}
#kibar{height:7px}#kibar i{background:linear-gradient(90deg,#c8902a,var(--ki),#fff0b0)}#kibar em{color:#3a2a08}
#xpbar{height:3px;border:0}#xpbar i{background:#e8e0ff}
#buffs{display:flex;flex-wrap:wrap;gap:4px;min-height:14px}#buffs span{font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(236,208,140,.2);border:1px solid rgba(236,208,140,.4)}
#buffs .r{background:rgba(255,90,70,.25)}#buffs .b{background:rgba(90,160,255,.25)}#buffs .g{background:rgba(255,210,90,.3)}
#inv{display:flex;gap:4px;margin-top:6px;margin-left:72px}
.iv{width:30px;height:30px;border-radius:6px;background:rgba(8,10,22,.65);border:1px solid rgba(255,255,255,.2);position:relative;display:grid;place-items:center;font:700 13px var(--serif)}
.iv small{position:absolute;right:2px;bottom:0;font:700 9px var(--sans);color:var(--gold)}.iv.on{border-color:#ffd35c;box-shadow:0 0 8px rgba(255,211,92,.6)}.iv.none{opacity:.35}
.top-c{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;text-shadow:0 1px 4px #000;min-width:260px}
.top-c small{display:block;font:500 11px/1 var(--sans);letter-spacing:.3em;color:var(--gold)}.top-c b{font:700 17px/1.4 var(--serif)}
#hud-obj{font-size:13px;margin-top:2px}#hud-obj .warn{color:#ff7a6a;font-weight:700}
.top-r{position:absolute;right:16px;top:calc(12px + env(safe-area-inset-top,0px));text-align:right;text-shadow:0 1px 4px #000;display:grid;gap:2px}
.top-r small{font-size:11px;letter-spacing:.25em;color:var(--gold)}.top-r b{font:900 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}.top-r .g{font:700 13px var(--sans);color:#ffd35c}
#go{position:absolute;right:24px;top:44%;font:900 26px/1 var(--serif);color:var(--gold-hi);letter-spacing:.1em;text-shadow:0 0 14px rgba(255,200,90,.9),0 2px 0 #3a2a10;animation:go .9s ease-in-out infinite}
@keyframes go{50%{transform:translateX(10px);opacity:.55}}
#combo{position:absolute;right:28px;top:30%;text-align:right;text-shadow:0 2px 0 #3a1a08}
#combo-n{font:900 44px/1 var(--serif);color:#ffe8a8}#combo small{display:block;font:700 13px var(--sans);letter-spacing:.3em;color:var(--gold)}#combo-r{font:900 16px var(--serif);color:#ff9a6a;letter-spacing:.1em}
#bossbar{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(580px,84vw);text-align:center}
.bname{font:900 18px/1.2 var(--serif);text-shadow:0 1px 4px #000;margin-bottom:4px}.bname small{font:500 12px var(--sans);color:var(--gold);margin-left:8px}
.bbar{position:relative;height:9px;background:rgba(6,8,18,.75);border:1px solid rgba(236,208,140,.6);border-radius:5px;overflow:hidden}
.bbar s,.bbar i{position:absolute;inset:0 auto 0 0;text-decoration:none}.bbar s{background:#fff2c8;opacity:.75}.bbar i{background:linear-gradient(180deg,#ff8a6a,#d93a2c 70%)}
#boss-ticks i{position:absolute;top:0;bottom:0;width:2px;background:rgba(0,0,0,.75)}
.pbar{height:3px;margin-top:3px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}.pbar i{display:block;height:100%;background:#ffd35c}
#bossbar.groggy .bbar{box-shadow:0 0 14px #ffd35c}#bossbar.barrier .bbar i{background:linear-gradient(180deg,#d8a0ff,#8a3ad0)}
.skillbar{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px}
#hot{display:flex;gap:8px}
.hk{position:relative;width:52px;height:52px;border-radius:10px;background:rgba(10,12,26,.7);border:1px solid rgba(236,208,140,.5);display:grid;place-items:center;overflow:hidden}
.hk b{font:900 22px/1 var(--serif);color:var(--gold-hi)}.hk img{position:absolute;inset:0;width:100%;height:100%;display:block}.hk small{z-index:2;text-shadow:0 1px 2px #000;color:#fff}.hk .cd{z-index:1}.hk.nomp img{filter:saturate(.3) brightness(.7)}
#spk-img{width:58px;height:58px;border-radius:50%;opacity:.55;filter:saturate(.5)}.sk2.ready #spk-img{opacity:1;filter:none}
.sic img{position:absolute;inset:0;width:100%;height:100%;border-radius:10px}.sic{overflow:hidden}.sic i{z-index:1;text-shadow:0 1px 2px #000}.sk.lock .sic img{filter:grayscale(1)}
.sei{width:22px;height:22px;vertical-align:middle;margin-right:6px;border-radius:5px}.hk small{position:absolute;left:4px;top:2px;font:700 10px var(--sans);color:var(--muted)}
.hk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.65)}.hk.empty{opacity:.35}.hk.nomp b{color:#6a86c8}
.sk2{position:relative;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(10,12,26,.6);border:2px solid rgba(255,255,255,.25)}
.sk2 svg{position:absolute;inset:-2px;transform:rotate(-90deg)}.sk2 b{font:900 24px/1 var(--serif);color:rgba(255,255,255,.55)}
.sk2.ready{border-color:var(--gold);box-shadow:0 0 22px rgba(255,210,120,.55)}.sk2.ready b{color:var(--gold-hi)}
#msgs{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:4px;max-width:min(460px,60vw)}
.msg{font-size:13px;padding:4px 10px;border-radius:6px;background:rgba(8,10,22,.6);border-left:3px solid var(--gold);text-shadow:0 1px 2px #000;animation:msgin .25s}
.msg .bad{color:var(--bad)}@keyframes msgin{from{opacity:0;transform:translateX(-10px)}}
#clearp{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);pointer-events:auto;border:1px solid var(--line);background:rgba(10,12,26,.7);border-radius:999px;padding:10px 24px;font:700 16px var(--serif);color:var(--gold-hi);animation:go 1.2s infinite}
/* 대화창 */
#talk{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,92vw);display:flex;gap:14px;align-items:flex-start;padding:16px 20px 18px;
  background:linear-gradient(0deg,rgba(8,10,22,.9),rgba(8,10,22,.72));border-top:1px solid var(--line);border-bottom:1px solid var(--line);pointer-events:none}
#talk-pt{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:900 24px var(--serif);background:radial-gradient(circle at 35% 30%,var(--pc),#101428 80%);border:2px solid var(--gold)}
#talk-who{font:900 16px var(--serif);color:var(--gold);margin-bottom:4px}#talk-txt{font:16px/1.6 var(--sans);min-height:52px}
#talk-next{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--gold)}#talk.tip #talk-who{color:#90d0ff}#talk.tip{border-color:rgba(120,190,255,.5)}
/* 컷인 */
#cutin{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#cutin::before{content:"";position:absolute;left:-10%;right:-10%;top:32%;height:36%;background:linear-gradient(90deg,transparent,rgba(0,0,0,.8) 20%,rgba(0,0,0,.8) 80%,transparent);transform:skewY(-4deg)}
#cutin::after{content:"";position:absolute;left:-10%;right:-10%;top:48%;height:3px;background:var(--cc);box-shadow:0 0 30px var(--cc);transform:skewY(-4deg)}
#cut-hz{position:absolute;left:0;right:0;top:34%;text-align:center;font:900 clamp(56px,10vw,120px)/1 var(--serif);color:#fff;letter-spacing:.08em;text-shadow:0 0 30px var(--cc),0 4px 0 rgba(0,0,0,.6)}
#cut-n{position:absolute;left:0;right:0;top:57%;text-align:center;font:900 26px var(--serif);color:var(--gold-hi);letter-spacing:.3em}
#cut-s{position:absolute;left:0;right:0;top:63%;text-align:center;font:500 13px var(--sans);color:var(--muted);letter-spacing:.3em}
#cutin.go #cut-hz{animation:cut .9s cubic-bezier(.2,.8,.2,1)}@keyframes cut{from{opacity:0;transform:translateX(-18%) scale(1.3)}25%{opacity:1;transform:none}to{opacity:.9}}
#super{position:absolute;left:50%;top:26%;transform:translateX(-50%);font:900 30px var(--serif);color:var(--gold-hi);letter-spacing:.2em;text-shadow:0 0 18px rgba(255,210,120,.9);pointer-events:none}
#super.go{animation:ban .5s}
/* 배너 */
#banner{position:absolute;left:0;right:0;top:32%;text-align:center;pointer-events:none;padding:16px;background:linear-gradient(90deg,transparent,rgba(8,10,24,.66) 22%,rgba(8,10,24,.66) 78%,transparent)}
#banner small{display:block;font:500 13px/1 var(--sans);letter-spacing:.5em;color:var(--gold)}
#banner h2{margin:10px 0 6px;font:900 clamp(32px,6vw,62px)/1.1 var(--serif);letter-spacing:.12em;background:linear-gradient(180deg,#fff8e2,#f0d08a 55%,#c89a4a);-webkit-background-clip:text;background-clip:text;color:transparent}
#banner p{margin:0;color:var(--muted);letter-spacing:.15em;font-size:14px}#banner.show{animation:ban .5s cubic-bezier(.2,.8,.2,1)}
#banner.boss h2{background:linear-gradient(180deg,#fff,#ffb4a0 50%,#d8402e);-webkit-background-clip:text;background-clip:text}
#banner.lvl h2,#banner.treasure h2{background:linear-gradient(180deg,#fff,#fff0a0 50%,#e0a020);-webkit-background-clip:text;background-clip:text}
@keyframes ban{from{opacity:0;transform:scaleY(.4)}}
/* 화면 */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
#title{background:linear-gradient(90deg,rgba(8,12,30,.82),rgba(8,12,30,.25) 55%,transparent);justify-content:center}
.tcard{max-width:520px;margin-left:clamp(0px,5vw,80px)}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--gold);margin:0 0 12px}
h1{margin:0;line-height:1}h1 .hz{display:block;font:900 clamp(52px,10vw,112px)/1 var(--serif);letter-spacing:.06em;background:linear-gradient(180deg,#fffaf0 10%,#f3d796 55%,#b98a3e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(30,18,4,.6))}
h1 .ko{display:block;margin-top:10px;font:700 clamp(18px,2.6vw,24px)/1 var(--serif);letter-spacing:.5em;color:var(--cream)}
.tmenu{display:grid;gap:6px;margin:26px 0 10px;max-width:340px}
.tm{text-align:left;border:0;background:transparent;padding:9px 16px;border-radius:999px;font:700 17px var(--serif);color:var(--muted);transition:background .15s,color .15s}
.tm.on{background:linear-gradient(90deg,rgba(236,208,140,.28),rgba(236,208,140,.04));color:var(--gold-hi)}.tm.on::before{content:"◆ ";color:var(--gold);font-size:12px}
.tdesc{min-height:20px;color:var(--muted);font-size:13px}.fine{margin-top:22px;font-size:11px;color:rgba(185,191,212,.6);max-width:46ch;line-height:1.6}
#select{background:linear-gradient(90deg,rgba(8,12,30,.72),transparent 48%),linear-gradient(0deg,rgba(8,12,30,.85),transparent 36%);justify-content:space-between}
.sinfo2{max-width:400px;display:grid;gap:10px}.sinfo2 small.eb{font-size:12px;letter-spacing:.34em;color:var(--gold)}
.sinfo2 h2{margin:0;font:900 clamp(36px,6vw,58px)/1 var(--serif);letter-spacing:.06em}.sinfo2 h2 em{font-style:normal;font-size:.36em;color:var(--gold);margin-left:10px;letter-spacing:.2em}
.stats{display:grid;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
.st{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.st span{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.st span i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#fff3cf);transition:width .3s}
#sel-desc{font-size:14px;line-height:1.6;color:var(--cream)}#sel-cmd{font-size:12px;color:var(--gold)}
.selbot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.cards{display:flex;gap:8px;flex-wrap:wrap;max-width:min(900px,100%)}
.card{width:66px;padding:8px 4px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(12,15,32,.7);display:grid;justify-items:center;gap:3px;transition:transform .15s}
.card b{font:900 24px/1 var(--serif);color:var(--c)}.card span{font:700 13px var(--serif)}.card small{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:62px;text-overflow:ellipsis}
.card[aria-pressed="true"]{border-color:var(--gold);transform:translateY(-6px);background:rgba(30,34,62,.9);box-shadow:0 0 22px rgba(236,208,140,.35)}
.btn-p{display:inline-flex;align-items:center;gap:12px;border:0;border-radius:999px;padding:8px 24px 8px 8px;background:linear-gradient(180deg,#f6f1e6,#e2d9c6);color:var(--cream-ink);font:700 17px/1 var(--serif);box-shadow:0 6px 22px rgba(0,0,0,.4)}
.btn-p::before{content:"";width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,#ffe39a 30%,#e9b64a 32%,#e9b64a 44%,#3b4255 46%)}
.btn-p small{font:500 11px var(--sans);opacity:.6}
.btn{border:0;border-radius:999px;padding:7px 16px;background:linear-gradient(180deg,#f6f1e6,#ddd3be);color:var(--cream-ink);font:700 13px var(--sans)}
.btn.ghost{background:rgba(10,12,26,.55);color:var(--text);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
#story{background:radial-gradient(ellipse at 50% 60%,rgba(40,20,8,.55),rgba(6,6,14,.94));align-items:center;justify-content:center;text-align:center}
#story .ch{font:900 clamp(34px,6vw,56px)/1.1 var(--serif);letter-spacing:.1em;background:linear-gradient(180deg,#fff8e2,#f0d08a 55%,#c89a4a);-webkit-background-clip:text;background-clip:text;color:transparent}
#story .sub{font:700 20px var(--serif);color:var(--cream);letter-spacing:.3em;margin:6px 0 4px}#story .lv{font-size:12px;color:var(--muted);letter-spacing:.2em}
#st-lines{max-width:640px;margin:26px auto;display:grid;gap:10px}#st-lines p{margin:0;font:16px/1.7 var(--serif);color:#f0e4cc;transition:opacity .3s}#st-lines p.hint{color:#d8b870;font-style:italic;font-size:14px}
#camp{pointer-events:none;background:linear-gradient(90deg,rgba(8,12,30,.78),rgba(8,12,30,.1) 45%,transparent)}
#camp>*{pointer-events:auto}
.cleft{max-width:360px;display:grid;gap:10px}.chead small{letter-spacing:.3em;color:var(--gold);font-size:12px}.chead h2{margin:4px 0 0;font:900 34px var(--serif);letter-spacing:.1em}
#c-hero{font:700 17px var(--serif)}#c-hero small{font:500 12px var(--sans);color:var(--muted);margin-left:6px}
#c-res{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}#c-res b{color:var(--gold-hi)}
.pr{display:flex;gap:4px}.pr i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}.pr i.done{background:var(--gold)}.pr i.now{background:#ff9a6a;box-shadow:0 0 8px #ff9a6a}
.trs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tr{font:900 14px var(--serif);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.3)}.tr.on{color:#ffd35c;border-color:#ffd35c}
.pts{font-size:13px;color:#ffb08a}.pts b{color:#ffe0a0}
/* 패널 */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);backdrop-filter:blur(8px)}

.sic2{grid-row:1/3;width:40px;height:40px}.si{grid-template-columns:auto 1fr auto!important}.si b,.si small{grid-column:2!important}.si button{grid-column:3!important}
.pvbox{height:clamp(220px,34vh,320px);margin:6px 0 4px;border-radius:12px;background:radial-gradient(ellipse at 50% 70%,rgba(236,208,140,.18),rgba(8,10,22,.55) 70%);border:1px solid rgba(236,208,140,.2);overflow:hidden}

.pg span{font-size:12px;color:var(--muted)}.gold{font-size:12px;color:var(--muted);margin-top:8px}.gold b{color:#ffd35c}
.itemact{margin-top:10px;background:rgba(0,0,0,.25);border-radius:10px;padding:10px}.tipin{font-size:13px;line-height:1.55}

.trees{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media (max-width:860px){.trees{grid-template-columns:1fr}}
.tree h4{margin:0 0 8px;font:900 16px var(--serif);color:var(--gold)}.tree h4 small{color:var(--muted);font:500 11px var(--sans)}

.sk.got{border-color:rgba(236,208,140,.3)}.sk.lock{opacity:.45}
.sic{position:relative;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font:900 20px var(--serif);background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,#101428),#0c0e1c);border:1px solid var(--c)}
.sic i{position:absolute;right:1px;bottom:0;font:700 9px var(--sans);font-style:normal;color:#ffe08a}
.sinfo b{font:700 14px var(--serif)}.sinfo small{display:block;font-size:11px;color:var(--muted)}.sinfo p{margin:3px 0 0;font-size:11.5px;line-height:1.45;color:#dcd6c8}
.sbtn{display:grid;gap:3px;justify-items:end}.hkb{width:22px;height:20px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);font:700 10px var(--sans);padding:0}.hkb.on{background:var(--gold);color:#221}
.stwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:760px){.stwrap{grid-template-columns:1fr}}
.atr{display:grid;grid-template-columns:50px 70px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;background:rgba(0,0,0,.2);margin-bottom:6px}
.atr b{font:900 15px var(--serif);color:var(--gold)}.atr span{font:700 18px var(--serif)}.atr span em{font-size:12px;color:#8fe070;font-style:normal}.atr small{font-size:11px;color:var(--muted)}
.derived{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px;align-content:start}.derived div{display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);padding:3px 0}.derived span{color:var(--muted)}
.lvl{font-size:13px;color:var(--cream)}
.smith{display:grid;gap:8px;margin-top:10px}.smith>div,.senh>div,.si,.slot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.22)}
.smith small,.senh small,.si small,.slot small{grid-column:1;font-size:11.5px;color:var(--muted)}.smith button,.senh button,.si button,.slot button{grid-row:1/3;grid-column:2}
.senh{display:grid;gap:6px}h4.sh{margin:14px 0 6px;font:900 15px var(--serif);color:var(--gold)}
.shop,.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}.res{color:#ffe08a}
.gacha{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gacha>div{padding:12px;border-radius:10px;background:rgba(0,0,0,.22);display:grid;gap:4px}.gacha small{color:var(--muted);font-size:12px;line-height:1.5}

.stb b{font:700 16px var(--serif)}.stb span{font-size:12px;color:var(--gold)}.stb small{grid-column:2;grid-row:1/3;align-self:center;font-size:12px;color:var(--muted)}

.help h4{margin:6px 0;font:900 15px var(--serif);color:var(--gold-hi)}.help p{font-size:13px;line-height:1.6;color:var(--cream)}
.choice .clines p{font:16px/1.7 var(--serif);margin:0 0 4px}.copt{display:grid;text-align:left;width:100%;margin-top:10px;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.3)}

.ending p{font:16px/1.8 var(--serif);text-align:center;margin:6px 0}.ending .hq{color:var(--gold-hi);font-size:17px}.ending .gold{color:#ffd35c}
.modalbg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,8,18,.62);backdrop-filter:blur(3px)}
#pause .pbox{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px 26px;width:min(560px,92vw);text-align:center}
#pause h2{margin:0 0 12px;font:900 36px var(--serif);color:var(--gold-hi);letter-spacing:.2em}#pause table{width:100%;font-size:12.5px;text-align:left;margin:10px 0;border-collapse:collapse}#pause td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.06)}#pause td:first-child{color:var(--gold)}
/* 터치 */
#touch{position:absolute;inset:auto 0 0 0;height:220px;pointer-events:none}
#stick{position:absolute;left:22px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);pointer-events:auto;touch-action:none}
